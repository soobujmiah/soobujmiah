<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Software, AI systems and practical technology</title>
  <desc id="desc">Portfolio-matched dark editorial banner with restrained green signal motion. It presents software and AI engineering alongside web, computer and Android support, office administration and digital workflow services.</desc>
  <style>
    .signal{stroke-dasharray:7 13;animation:signal-travel 9s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:signal-pulse 9s ease-in-out infinite}
    .p2{animation-delay:-2.25s}.p3{animation-delay:-4.5s}.p4{animation-delay:-6.75s}
    .ambient{animation:ambient-breathe 12s ease-in-out infinite}
    @keyframes signal-travel{to{stroke-dashoffset:-200}}
    @keyframes signal-pulse{0%,100%{opacity:.4;transform:scale(.85)}12%,20%{opacity:1;transform:scale(1.18)}30%{opacity:.55;transform:scale(1)}}
    @keyframes ambient-breathe{0%,100%{opacity:.55}50%{opacity:.8}}
    @media(prefers-reduced-motion:reduce){.signal,.pulse,.ambient{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset=".54" stop-color="#07150D"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <radialGradient id="glow" cx="52%" cy="38%" r="74%"><stop stop-color="#22c55e" stop-opacity=".15"/><stop offset=".58" stop-color="#10b981" stop-opacity=".035"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981" stop-opacity=".2"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".85"/><stop offset="1" stop-color="#10b981" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#e4e2df" stroke-opacity=".03"/></pattern>
  </defs>
  <rect width="1600" height="590" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="590" rx="24" fill="url(#grid)"/>
  <rect class="ambient" width="1600" height="590" rx="24" fill="url(#glow)"/>
  <path d="M72 90H1528" stroke="#e4e2df" stroke-opacity=".08"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="62" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#4ade80">SOOBUJMIAH / ENGINEERING + PRACTICAL TECHNOLOGY</text>
    <text x="72" y="145" font-family="Instrument Serif,Georgia,serif" font-size="56" fill="#e4e2df">Sobuj Miah</text>
    <text x="76" y="184" font-size="20" font-weight="600" fill="#e4e2df">Independent Software &amp; AI Systems Engineer</text>
    <text x="76" y="215" font-size="14" fill="#e4e2df" fill-opacity=".68">On-device AI · Android · ARM64 Linux · Software systems · Automation</text>
    <text x="76" y="241" font-size="14" fill="#e4e2df" fill-opacity=".68">Web and software services · Computer / Android support · Office and digital operations</text>

    <g>
      <rect x="76" y="276" width="458" height="92" rx="12" fill="#060706" fill-opacity=".78" stroke="#4ade80" stroke-opacity=".28"/>
      <text x="96" y="303" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.6" fill="#4ade80">01 / ENGINEERING</text>
      <text x="96" y="332" font-size="17" font-weight="600" fill="#e4e2df">AI · Android · Linux · Tooling</text>
      <text x="96" y="353" font-size="12" fill="#e4e2df" fill-opacity=".58">Build, inspect, test and document real systems</text>
    </g>
    <g>
      <rect x="552" y="276" width="458" height="92" rx="12" fill="#060706" fill-opacity=".78" stroke="#4ade80" stroke-opacity=".2"/>
      <text x="572" y="303" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.6" fill="#4ade80">02 / DIGITAL SERVICES</text>
      <text x="572" y="332" font-size="17" font-weight="600" fill="#e4e2df">Web · Software · Device support</text>
      <text x="572" y="353" font-size="12" fill="#e4e2df" fill-opacity=".58">Practical solutions for people and small teams</text>
    </g>
    <g>
      <rect x="1028" y="276" width="496" height="92" rx="12" fill="#060706" fill-opacity=".78" stroke="#4ade80" stroke-opacity=".2"/>
      <text x="1048" y="303" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.6" fill="#4ade80">03 / PROFESSIONAL SUPPORT</text>
      <text x="1048" y="332" font-size="17" font-weight="600" fill="#e4e2df">Office · Data · Business workflows</text>
      <text x="1048" y="353" font-size="12" fill="#e4e2df" fill-opacity=".58">Administration and technology-assisted work</text>
    </g>
  </g>

  <g font-family="JetBrains Mono,monospace">
    <text x="76" y="416" font-size="10" font-weight="700" letter-spacing="2.2" fill="#4ade80">A PRACTICAL DELIVERY CYCLE</text>
    <path d="M92 454H1508" stroke="#4ade80" stroke-opacity=".18" stroke-width="2"/>
    <path class="signal" d="M92 454H1508" fill="none" stroke="url(#line)" stroke-width="2.4"/>
    <g class="pulse"><circle cx="104" cy="454" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="104" cy="454" r="2" fill="#4ade80"/></g>
    <g class="pulse p2"><circle cx="452" cy="454" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="452" cy="454" r="2" fill="#4ade80"/></g>
    <g class="pulse p3"><circle cx="800" cy="454" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="800" cy="454" r="2" fill="#4ade80"/></g>
    <g class="pulse p4"><circle cx="1148" cy="454" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="1148" cy="454" r="2" fill="#4ade80"/></g>
    <g font-size="11" fill="#e4e2df" fill-opacity=".78">
      <text x="92" y="480">UNDERSTAND</text><text x="440" y="480">BUILD / SUPPORT</text><text x="788" y="480">TEST / CHECK</text><text x="1136" y="480">DELIVER / DOCUMENT</text>
    </g>
    <text x="76" y="535" font-family="Inter,Arial,sans-serif" font-size="12" fill="#e4e2df" fill-opacity=".52">Phone-first engineering · evidence-led claims · practical help for offices, individuals and businesses</text>
    <text x="1524" y="535" text-anchor="end" font-size="10" fill="#e4e2df" fill-opacity=".32">#050507 · #07150D · #22C55E · #4ADE80</text>
  </g>
  <rect x="1" y="1" width="1598" height="588" rx="24" fill="none" stroke="#e4e2df" stroke-opacity=".1"/>
</svg>