<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Independent Software &amp; AI Systems Engineer</title>
  <desc id="desc">A dark technical green visual matching the Sobuj Miah portfolio, with world-map contours, signal paths, particles and engineering telemetry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.48" stop-color="#06110b"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#10b981" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#e4e2df" stroke-opacity="0.035"/>
      <circle cx="0" cy="0" r="1.3" fill="#4ade80" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="24" fill="url(#grid)"/>
  <ellipse cx="800" cy="245" rx="610" ry="270" fill="url(#glow)" filter="url(#blur)"/>

  <!-- restrained technical world-map contours -->
  <g fill="none" stroke="#22c55e" stroke-opacity="0.15" stroke-width="2">
    <path d="M90 180C160 120 215 145 270 112s96-20 142 25 82 34 125 7 96-22 133 18 75 45 126 13 88-63 142-31 93 78 158 48 113-44 188-4"/>
    <path d="M55 235c78-48 138-21 204-36 79-18 107 15 167 45 63 31 111 4 168-17 65-24 112-2 169 27 67 34 117 21 171-18 59-43 111-52 177-25 67 27 117 24 195-12"/>
    <path d="M118 298c67-26 126-13 181 13 61 29 105 34 167 11 72-27 125-26 185 4 66 33 118 38 182 9 72-33 123-28 184 4 66 34 134 34 204-3"/>
    <path d="M178 354c61-11 106 11 151 34 55 28 107 22 163-2 61-27 116-25 171 8 54 32 112 38 174 11 60-26 113-18 165 10 65 35 125 32 198-1"/>
  </g>

  <!-- route arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M165 398 C 420 70, 1120 75, 1430 370" stroke="url(#signal)" stroke-width="2" stroke-opacity="0.75"/>
    <path d="M310 430 C 610 180, 910 160, 1290 420" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
    <path d="M520 92 C 710 310, 940 330, 1180 108" stroke="#4ade80" stroke-width="1" stroke-opacity="0.32"/>
  </g>

  <!-- nodes -->
  <g fill="#4ade80">
    <circle cx="165" cy="398" r="4"/><circle cx="1430" cy="370" r="4"/>
    <circle cx="310" cy="430" r="3"/><circle cx="1290" cy="420" r="3"/>
    <circle cx="520" cy="92" r="3"/><circle cx="1180" cy="108" r="3"/>
  </g>
  <g fill="#22c55e" fill-opacity="0.16" filter="url(#soft)">
    <circle cx="165" cy="398" r="24"/><circle cx="1430" cy="370" r="24"/>
    <circle cx="800" cy="250" r="38"/>
  </g>

  <!-- engineering telemetry -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e4e2df">
    <text x="82" y="82" font-size="16" fill="#4ade80" letter-spacing="4">SOOBUJMIAH / SYSTEMS</text>
    <text x="82" y="145" font-size="44" font-weight="700" letter-spacing="-1">INDEPENDENT SOFTWARE</text>
    <text x="82" y="193" font-size="44" font-weight="700" letter-spacing="-1">&amp; AI SYSTEMS ENGINEER</text>
    <text x="84" y="235" font-size="15" fill="#e4e2df" fill-opacity="0.58">ON-DEVICE AI  ·  ANDROID  ·  ARM64 LINUX  ·  NATIVE TOOLING</text>

    <g transform="translate(84 292)">
      <rect width="180" height="54" rx="10" fill="#060706" fill-opacity="0.78" stroke="#e4e2df" stroke-opacity="0.10"/>
      <text x="18" y="22" font-size="10" fill="#4ade80" letter-spacing="2">BUILD MODE</text>
      <text x="18" y="42" font-size="13">PHONE-FIRST</text>
    </g>
    <g transform="translate(278 292)">
      <rect width="180" height="54" rx="10" fill="#060706" fill-opacity="0.78" stroke="#e4e2df" stroke-opacity="0.10"/>
      <text x="18" y="22" font-size="10" fill="#4ade80" letter-spacing="2">INFERENCE</text>
      <text x="18" y="42" font-size="13">LOCAL / ARM64</text>
    </g>
    <g transform="translate(472 292)">
      <rect width="180" height="54" rx="10" fill="#060706" fill-opacity="0.78" stroke="#e4e2df" stroke-opacity="0.10"/>
      <text x="18" y="22" font-size="10" fill="#4ade80" letter-spacing="2">EVIDENCE</text>
      <text x="18" y="42" font-size="13">DEVICE VERIFIED</text>
    </g>
  </g>

  <!-- signal strip -->
  <rect x="82" y="402" width="1436" height="1" fill="url(#signal)" opacity="0.7"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#e4e2df" fill-opacity="0.38" letter-spacing="2">
    <text x="84" y="430">TERMUX / PROOT</text>
    <text x="350" y="430">GITHUB ACTIONS</text>
    <text x="620" y="430">ADB DEPLOY</text>
    <text x="850" y="430">REAL DEVICE</text>
    <text x="1080" y="430">FAIL → FIX → REBUILD → RETEST</text>
  </g>
  <text x="82" y="476" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" fill="#4ade80" fill-opacity="0.75">portfolio DNA: #050507 · #22c55e · #4ade80 · #10b981</text>
  <rect x="1" y="1" width="1598" height="518" rx="24" fill="none" stroke="#e4e2df" stroke-opacity="0.09"/>
</svg>
