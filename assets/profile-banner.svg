<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Independent Software &amp; AI Systems Engineer</title>
  <desc id="desc">A glossy, dark emerald technical identity banner with layered glass panels, animated circuit traces, a moving scanline and pulsing signal nodes. It includes engineering, digital services, and office technology work.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    .ui{font-family:Inter,Arial,sans-serif}.display{font-family:'Instrument Serif',Georgia,serif}.mono{font-family:'JetBrains Mono',monospace}
    .trace{fill:none;stroke:url(#trace);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 13;animation:trace-flow 14s linear infinite}
    .trace.t2{animation-duration:18s;animation-direction:reverse}.trace.t3{animation-duration:20s;animation-delay:-4s}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4.8s ease-in-out infinite}.p2{animation-delay:-1.2s}.p3{animation-delay:-2.4s}.p4{animation-delay:-.7s}
    
    .breathe{animation:breathe 10s ease-in-out infinite}
    
    @keyframes trace-flow{to{stroke-dashoffset:-216}}
    @keyframes pulse{0%,100%{opacity:.45;transform:scale(.78)}45%,60%{opacity:1;transform:scale(1.2)}}
    
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:.95}}
    
    @media(prefers-reduced-motion:reduce){.trace,.pulse,.breathe{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset=".42" stop-color="#07150D"/><stop offset=".75" stop-color="#06100B"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#143522" stop-opacity=".72"/><stop offset=".42" stop-color="#07150D" stop-opacity=".92"/><stop offset="1" stop-color="#050507" stop-opacity=".97"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#b7ffd2" stop-opacity=".45"/><stop offset=".56" stop-color="#4ade80" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981" stop-opacity=".12"/><stop offset=".48" stop-color="#4ade80"/><stop offset="1" stop-color="#22c55e" stop-opacity=".12"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80" stop-opacity=".75"/><stop offset=".45" stop-color="#22c55e" stop-opacity=".12"/><stop offset="1" stop-color="#e4e2df" stop-opacity=".14"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22c55e" stop-opacity=".24"/><stop offset=".55" stop-color="#10b981" stop-opacity=".07"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#e4e2df" stroke-opacity=".045"/></pattern>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#4ade80" fill-opacity=".28"/></pattern>
    <clipPath id="clip"><rect width="1600" height="650" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="650" fill="url(#bg)"/><rect width="1600" height="650" fill="url(#grid)"/>
    <ellipse class="breathe" cx="1180" cy="190" rx="500" ry="310" fill="url(#halo)"/><ellipse cx="290" cy="570" rx="410" ry="230" fill="url(#halo)" opacity=".6"/>
    <path d="M0 112H430L466 148H650M1600 84H1360L1316 128H1190M0 520H110L154 476H270M1600 540H1460L1410 490H1320" fill="none" stroke="#22c55e" stroke-opacity=".18" stroke-width="1.2"/>
    <path class="trace" d="M0 112H430L466 148H650M1600 84H1360L1316 128H1190M0 520H110L154 476H270M1600 540H1460L1410 490H1320"/>
    <g class="pulse"><circle cx="466" cy="148" r="5" fill="#07150D" stroke="#4ade80" stroke-width="1.5"/><circle cx="466" cy="148" r="1.8" fill="#4ade80"/></g>
    <g class="pulse p2"><circle cx="1316" cy="128" r="5" fill="#07150D" stroke="#4ade80" stroke-width="1.5"/><circle cx="1316" cy="128" r="1.8" fill="#4ade80"/></g>
    <g class="pulse p3"><circle cx="154" cy="476" r="5" fill="#07150D" stroke="#4ade80" stroke-width="1.5"/><circle cx="154" cy="476" r="1.8" fill="#4ade80"/></g>
    <g class="pulse p4"><circle cx="1410" cy="490" r="5" fill="#07150D" stroke="#4ade80" stroke-width="1.5"/><circle cx="1410" cy="490" r="1.8" fill="#4ade80"/></g>

    <rect x="48" y="36" width="1504" height="578" rx="22" fill="#050507" fill-opacity=".22" stroke="url(#edge)"/>
    <path d="M70 92H1530" stroke="#e4e2df" stroke-opacity=".12"/>
    <path d="M70 93H390" stroke="#4ade80" stroke-width="2" stroke-opacity=".8"/>
    <g class="mono" font-size="11" font-weight="600" letter-spacing="2.4" fill="#4ade80">
      <text x="76" y="72">SOOBUJMIAH</text><text x="1524" y="72" text-anchor="end" fill="#e4e2df" fill-opacity=".55">ENGINEERING / SYSTEMS / PRACTICAL TECHNOLOGY</text>
    </g>
    <g class="ui">
      <text x="74" y="177" class="display" font-size="70" fill="#e4e2df">Sobuj Miah</text>
      <text x="78" y="218" font-size="20" font-weight="600" fill="#e4e2df">Independent Software &amp; AI Systems Engineer</text>
      <text x="78" y="249" font-size="14" fill="#e4e2df" fill-opacity=".78">On-device AI · Android · ARM64 Linux · Native tooling · Automation</text>
      <text x="78" y="274" font-size="13" fill="#e4e2df" fill-opacity=".56">Web and software services · Device support · Office and digital operations</text>
    </g>

    <g>
      <rect x="74" y="318" width="458" height="116" rx="13" fill="url(#glass)" stroke="url(#edge)"/>
      <rect x="74" y="318" width="458" height="116" rx="13" fill="url(#micro)" opacity=".28"/>
      <path d="M88 319H360" stroke="#b7ffd2" stroke-opacity=".34"/>
      <text x="96" y="347" class="mono" font-size="10" font-weight="600" letter-spacing="1.8" fill="#4ade80">01 / ENGINEERING</text>
      <text x="96" y="379" class="ui" font-size="18" font-weight="600" fill="#e4e2df">AI · Android · Linux · Tooling</text>
      <text x="96" y="405" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".64">Build, inspect, test and document real systems</text>
      
    </g>
    <g>
      <rect x="552" y="318" width="458" height="116" rx="13" fill="url(#glass)" stroke="url(#edge)"/>
      <path d="M566 319H842" stroke="#b7ffd2" stroke-opacity=".3"/>
      <text x="574" y="347" class="mono" font-size="10" font-weight="600" letter-spacing="1.8" fill="#4ade80">02 / DIGITAL SERVICES</text>
      <text x="574" y="379" class="ui" font-size="18" font-weight="600" fill="#e4e2df">Web · Software · Device support</text>
      <text x="574" y="405" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".64">Practical solutions for people and teams</text>
      
    </g>
    <g>
      <rect x="1030" y="318" width="458" height="116" rx="13" fill="url(#glass)" stroke="url(#edge)"/>
      <path d="M1044 319H1320" stroke="#b7ffd2" stroke-opacity=".3"/>
      <text x="1052" y="347" class="mono" font-size="10" font-weight="600" letter-spacing="1.8" fill="#4ade80">03 / PROFESSIONAL SUPPORT</text>
      <text x="1052" y="379" class="ui" font-size="18" font-weight="600" fill="#e4e2df">Office · Data · Business workflows</text>
      <text x="1052" y="405" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".64">Administration and technology-assisted work</text>
    </g>

    <g class="mono">
      <text x="78" y="486" font-size="10" font-weight="600" letter-spacing="2.2" fill="#4ade80">DELIVERY CYCLE</text>
      <path d="M78 518H1522" stroke="#4ade80" stroke-opacity=".18" stroke-width="2"/>
      <path class="trace t2" d="M78 518H1522"/>
      <g fill="#07150D" stroke="#4ade80" stroke-width="1.5">
        <circle cx="112" cy="518" r="6"/><circle cx="478" cy="518" r="6"/><circle cx="844" cy="518" r="6"/><circle cx="1210" cy="518" r="6"/>
      </g>
      <g class="pulse"><circle cx="112" cy="518" r="2.2" fill="#4ade80"/></g><g class="pulse p2"><circle cx="478" cy="518" r="2.2" fill="#4ade80"/></g><g class="pulse p3"><circle cx="844" cy="518" r="2.2" fill="#4ade80"/></g><g class="pulse p4"><circle cx="1210" cy="518" r="2.2" fill="#4ade80"/></g>
      <g font-size="10" fill="#e4e2df" fill-opacity=".78"><text x="112" y="542">UNDERSTAND</text><text x="478" y="542">BUILD / SUPPORT</text><text x="844" y="542">TEST / CHECK</text><text x="1210" y="542">DELIVER / DOCUMENT</text></g>
    </g>
    <text x="78" y="582" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".52">Phone-first engineering · evidence-led claims · practical technology for real-world needs</text>
    
    <path d="M70 598H1530" stroke="#e4e2df" stroke-opacity=".1"/>
    <rect x="1" y="1" width="1598" height="648" rx="26" fill="none" stroke="#e4e2df" stroke-opacity=".16"/>
  </g>
</svg>