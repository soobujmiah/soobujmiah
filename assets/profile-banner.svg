<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Independent Software &amp; AI Systems Engineer</title>
  <desc id="desc">Dark technical green profile banner with layered grid depth, animated signal paths, engineering telemetry, capabilities and phone-first workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="0.48" stop-color="#06110b"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="42%" r="64%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="gridFar" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e4e2df" stroke-opacity="0.028"/>
      <circle cx="0" cy="0" r="1.2" fill="#4ade80" fill-opacity="0.11"/>
    </pattern>
    <pattern id="gridNear" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="#22c55e" stroke-opacity="0.045"/>
    </pattern>
    <path id="route1" d="M120 430 C 420 50, 1130 70, 1480 392"/>
    <path id="route2" d="M260 468 C 590 190, 950 170, 1360 452"/>
    <path id="route3" d="M500 105 C 720 340, 960 350, 1220 115"/>
  </defs>

  <rect width="1600" height="560" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="26" fill="url(#gridFar)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="64 64" dur="28s" repeatCount="indefinite"/>
  </rect>
  <rect width="1600" height="560" rx="26" fill="url(#gridNear)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-128 -128" dur="42s" repeatCount="indefinite"/>
  </rect>
  <ellipse cx="820" cy="260" rx="660" ry="285" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="opacity" values="0.72;1;0.72" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- restrained technical contours -->
  <g fill="none" stroke="#22c55e" stroke-opacity="0.14" stroke-width="2">
    <path d="M70 182C150 118 215 146 278 110s101-18 148 28 88 31 132 5 101-19 139 20 78 46 129 13 92-63 147-29 98 76 164 46 116-43 198-2"/>
    <path d="M42 250c84-51 149-22 218-38 82-19 113 15 175 47 65 33 115 4 174-18 68-25 118-2 177 28 70 36 123 21 180-19 61-44 116-53 185-25 70 29 122 25 207-13"/>
    <path d="M110 318c70-28 132-14 190 14 64 30 110 35 174 11 75-28 131-27 193 4 69 35 123 40 190 9 74-34 128-29 191 4 70 35 141 35 213-3"/>
    <path d="M168 380c64-12 111 11 158 36 58 30 112 23 170-2 64-28 121-26 178 8 57 34 117 40 181 12 63-27 119-19 173 11 68 37 131 34 207-1"/>
  </g>

  <!-- route arcs -->
  <g fill="none" stroke-linecap="round">
    <use href="#route1" stroke="url(#signal)" stroke-width="2.2" stroke-opacity="0.78"/>
    <use href="#route2" stroke="#10b981" stroke-width="1" stroke-opacity="0.42"/>
    <use href="#route3" stroke="#4ade80" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- moving data packets: script-free SVG motion -->
  <g fill="#4ade80">
    <circle r="4"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#route1"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="11s" begin="-4s" repeatCount="indefinite"><mpath href="#route2"/></animateMotion></circle>
    <circle r="3"><animateMotion dur="9s" begin="-2s" repeatCount="indefinite"><mpath href="#route3"/></animateMotion></circle>
  </g>
  <g fill="#22c55e" fill-opacity="0.16" filter="url(#soft)">
    <circle cx="120" cy="430" r="25"><animate attributeName="r" values="18;30;18" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1480" cy="392" r="25"><animate attributeName="r" values="18;30;18" dur="4s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="260" r="40"><animate attributeName="opacity" values="0.45;0.8;0.45" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- main identity -->
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e4e2df">
    <text x="76" y="78" font-size="16" fill="#4ade80" letter-spacing="4">SOOBUJMIAH / SYSTEMS</text>
    <text x="76" y="142" font-size="45" font-weight="700" letter-spacing="-1">INDEPENDENT SOFTWARE</text>
    <text x="76" y="192" font-size="45" font-weight="700" letter-spacing="-1">&amp; AI SYSTEMS ENGINEER</text>
    <text x="78" y="228" font-size="15" fill="#e4e2df" fill-opacity="0.58">ON-DEVICE AI  ·  ANDROID  ·  ARM64 LINUX  ·  NATIVE TOOLING</text>

    <!-- larger telemetry cards -->
    <g transform="translate(76 270)">
      <rect width="250" height="72" rx="12" fill="#060706" fill-opacity="0.84" stroke="#e4e2df" stroke-opacity="0.12"/>
      <rect x="1" y="1" width="248" height="70" rx="11" fill="none" stroke="#22c55e" stroke-opacity="0.05"/>
      <text x="20" y="25" font-size="10" fill="#4ade80" letter-spacing="2">BUILD MODE</text>
      <text x="20" y="51" font-size="16">PHONE-FIRST</text>
    </g>
    <g transform="translate(344 270)">
      <rect width="250" height="72" rx="12" fill="#060706" fill-opacity="0.84" stroke="#e4e2df" stroke-opacity="0.12"/>
      <rect x="1" y="1" width="248" height="70" rx="11" fill="none" stroke="#22c55e" stroke-opacity="0.05"/>
      <text x="20" y="25" font-size="10" fill="#4ade80" letter-spacing="2">INFERENCE</text>
      <text x="20" y="51" font-size="16">LOCAL / ARM64</text>
    </g>
    <g transform="translate(612 270)">
      <rect width="250" height="72" rx="12" fill="#060706" fill-opacity="0.84" stroke="#e4e2df" stroke-opacity="0.12"/>
      <rect x="1" y="1" width="248" height="70" rx="11" fill="none" stroke="#22c55e" stroke-opacity="0.05"/>
      <text x="20" y="25" font-size="10" fill="#4ade80" letter-spacing="2">EVIDENCE</text>
      <text x="20" y="51" font-size="16">DEVICE VERIFIED</text>
    </g>

    <!-- capability panel in the formerly empty right side -->
    <g transform="translate(930 255)">
      <rect width="590" height="112" rx="14" fill="#060706" fill-opacity="0.7" stroke="#e4e2df" stroke-opacity="0.1"/>
      <text x="22" y="26" font-size="10" fill="#4ade80" letter-spacing="2">CAPABILITIES / SERVICES</text>
      <text x="22" y="53" font-size="13">WEB · SOFTWARE · ANDROID · COMPUTER</text>
      <text x="22" y="77" font-size="13">BUSINESS TECHNOLOGY · GRAPHICS · DATA WORK</text>
      <text x="22" y="99" font-size="10" fill="#e4e2df" fill-opacity="0.42">PRACTICAL DIGITAL SUPPORT FOR INDIVIDUALS, OFFICES &amp; BUSINESSES</text>
    </g>
  </g>

  <!-- engineering delivery loop -->
  <rect x="76" y="405" width="1444" height="1" fill="url(#signal)" opacity="0.72"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="2">
    <text x="78" y="431" fill="#e4e2df" fill-opacity="0.48">TERMUX / PROOT</text>
    <text x="335" y="431" fill="#e4e2df" fill-opacity="0.48">GITHUB ACTIONS</text>
    <text x="590" y="431" fill="#e4e2df" fill-opacity="0.48">ADB DEPLOY</text>
    <text x="810" y="431" fill="#e4e2df" fill-opacity="0.48">REAL DEVICE</text>
    <text x="1015" y="431" fill="#4ade80" fill-opacity="0.72">FAIL → FIX → REBUILD → RETEST</text>
    <text x="78" y="462" fill="#4ade80" fill-opacity="0.72">WEB · SOFTWARE · ANDROID · BUSINESS TECH · GRAPHICS · OFFICE / DATA</text>
    <text x="78" y="494" fill="#e4e2df" fill-opacity="0.32">portfolio DNA: #050507 · #22c55e · #4ade80 · #10b981</text>
  </g>
  <rect x="1" y="1" width="1598" height="558" rx="26" fill="none" stroke="#e4e2df" stroke-opacity="0.09"/>
</svg>
