<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Independent Software &amp; AI Systems Engineer</title>
  <desc id="desc">Dark technical green profile banner with layered depth, moving grid, signal pulses and phone-first engineering telemetry.</desc>
  <style>
