<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Engineering and professional services</title>
  <desc id="desc">A compact overview of software and AI engineering, web and application delivery, device support, and office and digital administration. This is a capability map, not a live activity counter.</desc>
  <style>
    .route{fill:none;stroke:#4ade80;stroke-opacity:.65;stroke-width:2;stroke-dasharray:6 10;animation:route-flow 12s linear infinite}
    .node-dot{animation:node-pulse 6s ease-in-out infinite}
    .d2{animation-delay:-1.5s}.d3{animation-delay:-3s}.d4{animation-delay:-4.5s}
    @keyframes route-flow{to{stroke-dashoffset:-192}}
    @keyframes node-pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
    @media(prefers-reduced-motion:reduce){.route,.node-dot{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset=".52" stop-color="#07150D"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%"><stop stop-color="#22c55e" stop-opacity=".13"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e4e2df" stroke-opacity=".028"/></pattern>
  </defs>
  <rect width="1200" height="500" rx="20" fill="url(#bg)"/><rect width="1200" height="500" rx="20" fill="url(#grid)"/><rect width="1200" height="500" rx="20" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="42" y="45" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="2.5" fill="#4ade80">CAPABILITY MAP / PRACTICAL OUTCOMES</text>
    <text x="42" y="79" font-family="Instrument Serif,Georgia,serif" font-size="31" fill="#e4e2df">Engineering is one part of the work.</text>
    <text x="42" y="104" font-size="12" fill="#e4e2df" fill-opacity=".58">Software, support and office workflows — kept distinct, connected by practical problem-solving.</text>
  </g>
  <g fill="none" stroke="#4ade80" stroke-opacity=".22" stroke-width="1.5">
    <path d="M600 154V180M600 180H300V206M600 180H900V206M300 315V340H600V366M900 315V340H600"/>
  </g>
  <g class="route"><path d="M600 154V180H300V206M600 180H900V206M300 315V340H600V366M900 315V340H600"/></g>
  <g>
    <rect x="380" y="120" width="440" height="35" rx="17" fill="#07150D" stroke="#4ade80" stroke-opacity=".45"/>
    <text x="600" y="142" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#4ade80">UNDERSTAND → SOLVE → VERIFY</text>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <g><rect x="42" y="206" width="516" height="109" rx="12" fill="#060706" stroke="#4ade80" stroke-opacity=".28"/><rect x="42" y="206" width="4" height="109" rx="2" fill="#4ade80"/>
      <text x="64" y="233" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#4ade80">01 / ENGINEERING</text>
      <text x="64" y="259" font-size="16" font-weight="600" fill="#e4e2df">Software · On-device AI · Android / Linux</text>
      <text x="64" y="283" font-size="12" fill="#e4e2df" fill-opacity=".62">Native tooling · automation · build / release workflows</text>
      <text x="64" y="301" font-size="11" fill="#e4e2df" fill-opacity=".42">CI and physical-device evidence where applicable</text>
    </g>
    <g><rect x="642" y="206" width="516" height="109" rx="12" fill="#060706" stroke="#4ade80" stroke-opacity=".2"/><rect x="642" y="206" width="4" height="109" rx="2" fill="#10b981"/>
      <text x="664" y="233" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#4ade80">02 / WEB + DIGITAL SERVICES</text>
      <text x="664" y="259" font-size="16" font-weight="600" fill="#e4e2df">Websites · Apps · Custom software</text>
      <text x="664" y="283" font-size="12" fill="#e4e2df" fill-opacity=".62">Web design / SEO · graphics · business technology</text>
      <text x="664" y="301" font-size="11" fill="#e4e2df" fill-opacity=".42">Scope and deliverables agreed per service</text>
    </g>
    <g><rect x="42" y="366" width="516" height="92" rx="12" fill="#060706" stroke="#4ade80" stroke-opacity=".2"/><rect x="42" y="366" width="4" height="92" rx="2" fill="#10b981"/>
      <text x="64" y="392" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#4ade80">03 / DEVICE SUPPORT</text>
      <text x="64" y="418" font-size="16" font-weight="600" fill="#e4e2df">Computer · Android · Troubleshooting</text>
      <text x="64" y="439" font-size="12" fill="#e4e2df" fill-opacity=".62">Setup, diagnostics and practical technical help</text>
    </g>
    <g><rect x="642" y="366" width="516" height="92" rx="12" fill="#060706" stroke="#4ade80" stroke-opacity=".2"/><rect x="642" y="366" width="4" height="92" rx="2" fill="#4ade80"/>
      <text x="664" y="392" font-family="JetBrains Mono,monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#4ade80">04 / OFFICE + DIGITAL OPERATIONS</text>
      <text x="664" y="418" font-size="16" font-weight="600" fill="#e4e2df">Administration · Data work · Documentation</text>
      <text x="664" y="439" font-size="12" fill="#e4e2df" fill-opacity=".62">Practical support for offices, institutions and small teams</text>
    </g>
  </g>
  <g class="node-dot"><circle cx="600" cy="180" r="3.5" fill="#4ade80"/></g><g class="node-dot d2"><circle cx="300" cy="206" r="3.5" fill="#4ade80"/></g><g class="node-dot d3"><circle cx="900" cy="206" r="3.5" fill="#4ade80"/></g><g class="node-dot d4"><circle cx="600" cy="366" r="3.5" fill="#4ade80"/></g>
  <rect x="1" y="1" width="1198" height="498" rx="20" fill="none" stroke="#e4e2df" stroke-opacity=".1"/>
</svg>