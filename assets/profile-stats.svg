<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Engineering telemetry</title>
  <desc id="desc">Five featured projects, 590 documented tests across GGEN and Songjog, three AOSP toolchain releases, seventeen canonical links, and the phone-first engineering delivery loop.</desc>
  <style>
    .delivery-track{stroke-dasharray:7 12;animation:delivery-flow 9s linear infinite}
    .stage-dot{animation:stage-pulse 9s linear infinite}
    .stage-1{animation-delay:0s}.stage-2{animation-delay:1.8s}.stage-3{animation-delay:3.6s}.stage-4{animation-delay:5.4s}.stage-5{animation-delay:7.2s}
    @keyframes delivery-flow{to{stroke-dashoffset:-190}}
    @keyframes stage-pulse{0%,12%,100%{opacity:.48}3%,9%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.delivery-track,.stage-dot{animation:none}}
  </style>
  <defs>
    <linearGradient id="stats-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset=".55" stop-color="#07150D"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <radialGradient id="stats-glow" cx="50%" cy="36%" r="75%"><stop stop-color="#22c55e" stop-opacity=".13"/><stop offset="1" stop-color="#050507" stop-opacity="0"/></radialGradient>
    <pattern id="stats-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e4e2df" stroke-opacity=".028"/></pattern>
    <linearGradient id="stats-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981" stop-opacity=".15"/><stop offset=".5" stop-color="#4ade80" stop-opacity=".8"/><stop offset="1" stop-color="#10b981" stop-opacity=".15"/></linearGradient>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#stats-bg)"/>
  <rect width="1200" height="430" rx="20" fill="url(#stats-grid)"/>
  <rect width="1200" height="430" rx="20" fill="url(#stats-glow)"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="42" y="48" font-size="11" font-weight="700" letter-spacing="3" fill="#4ade80">ENGINEERING TELEMETRY / VERIFIED SIGNALS</text>
    <text x="42" y="80" font-size="25" font-weight="700" fill="#e4e2df">Systems, evidence &amp; delivery — not vanity metrics.</text>
    <path d="M42 96H1158" stroke="#e4e2df" stroke-opacity=".1"/>

    <g>
      <rect x="42" y="112" width="260" height="112" rx="13" fill="#060907" stroke="#4ade80" stroke-opacity=".26"/>
      <text x="62" y="140" font-size="10" font-weight="700" letter-spacing="1.7" fill="#4ade80">FEATURED SYSTEMS</text>
      <text x="62" y="193" font-size="43" font-weight="700" fill="#e4e2df">05</text>
      <text x="148" y="170" font-size="10" fill="#e4e2df" fill-opacity=".6">FEATURED</text><text x="148" y="186" font-size="10" fill="#e4e2df" fill-opacity=".6">PROJECTS</text>
      <path d="M62 207H282" stroke="#4ade80" stroke-opacity=".18"/>
    </g>
    <g>
      <rect x="322" y="112" width="260" height="112" rx="13" fill="#060907" stroke="#e4e2df" stroke-opacity=".12"/>
      <text x="342" y="140" font-size="10" font-weight="700" letter-spacing="1.7" fill="#4ade80">DOCUMENTED TESTS</text>
      <text x="342" y="193" font-size="43" font-weight="700" fill="#e4e2df">590</text>
      <text x="446" y="170" font-size="11" fill="#e4e2df" fill-opacity=".6">GGEN +</text><text x="446" y="187" font-size="11" fill="#e4e2df" fill-opacity=".6">SONGJOG</text>
      <path d="M342 207H562" stroke="#4ade80" stroke-opacity=".18"/>
    </g>
    <g>
      <rect x="602" y="112" width="260" height="112" rx="13" fill="#060907" stroke="#e4e2df" stroke-opacity=".12"/>
      <text x="622" y="140" font-size="10" font-weight="700" letter-spacing="1.7" fill="#4ade80">AOSP RELEASES</text>
      <text x="622" y="193" font-size="43" font-weight="700" fill="#e4e2df">03</text>
      <text x="712" y="170" font-size="11" fill="#e4e2df" fill-opacity=".6">ADT</text><text x="712" y="187" font-size="11" fill="#e4e2df" fill-opacity=".6">V35 → V37</text>
      <path d="M622 207H842" stroke="#4ade80" stroke-opacity=".18"/>
    </g>
    <g>
      <rect x="882" y="112" width="276" height="112" rx="13" fill="#060907" stroke="#e4e2df" stroke-opacity=".12"/>
      <text x="902" y="140" font-size="10" font-weight="700" letter-spacing="1.7" fill="#4ade80">CANONICAL LINKS</text>
      <text x="902" y="193" font-size="43" font-weight="700" fill="#e4e2df">17</text>
      <text x="988" y="170" font-size="11" fill="#e4e2df" fill-opacity=".6">IDENTITY</text><text x="988" y="187" font-size="11" fill="#e4e2df" fill-opacity=".6">LINKS</text>
      <path d="M902 207H1138" stroke="#4ade80" stroke-opacity=".18"/>
    </g>
  </g>

  <g transform="translate(42 246)" font-family="JetBrains Mono,monospace">
    <rect width="1116" height="142" rx="13" fill="#060907" stroke="#4ade80" stroke-opacity=".22"/>
    <text x="20" y="25" font-size="10" font-weight="700" letter-spacing="2" fill="#4ade80">PHONE-FIRST DELIVERY LOOP</text>
    <path d="M70 60H1046" stroke="#4ade80" stroke-opacity=".18" stroke-width="2"/>
    <path class="delivery-track" d="M70 60H1046" stroke="url(#stats-line)" stroke-width="2.5" fill="none"/>
    <g class="stage-dot stage-1"><circle cx="94" cy="60" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="94" cy="60" r="2" fill="#4ade80"/></g>
    <g class="stage-dot stage-2"><circle cx="347" cy="60" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="347" cy="60" r="2" fill="#4ade80"/></g>
    <g class="stage-dot stage-3"><circle cx="600" cy="60" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="600" cy="60" r="2" fill="#4ade80"/></g>
    <g class="stage-dot stage-4"><circle cx="853" cy="60" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="853" cy="60" r="2" fill="#4ade80"/></g>
    <g class="stage-dot stage-5"><circle cx="1106" cy="60" r="6" fill="#07150D" stroke="#4ade80" stroke-width="2"/><circle cx="1106" cy="60" r="2" fill="#4ade80"/></g>
    <g font-size="10.5" fill="#e4e2df" fill-opacity=".78" text-anchor="middle">
      <text x="94" y="83">01  TERMUX + PROOT</text><text x="347" y="83">02  GITHUB ACTIONS</text><text x="600" y="83">03  ADB DEPLOY</text><text x="853" y="83">04  REAL DEVICE</text><text x="1106" y="83">05  VERIFY</text>
    </g>
    <text x="20" y="119" font-size="10.5" fill="#e4e2df" fill-opacity=".48">FAIL → FIX → REBUILD → DEPLOY → RETEST · hardware-dependent claims are checked before shipping</text>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="20" fill="none" stroke="#e4e2df" stroke-opacity=".1"/>
</svg>