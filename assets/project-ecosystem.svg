<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah project ecosystem</title>
  <desc id="desc">Architecture map connecting LAI, GGEN, ADT, Ternux, Songjog and DocDr around a phone-first engineering workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050507"/><stop offset="0.5" stop-color="#07150d"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981" stop-opacity="0.15"/><stop offset="0.5" stop-color="#4ade80" stop-opacity="0.85"/><stop offset="1" stop-color="#10b981" stop-opacity="0.15"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#e4e2df" stroke-opacity="0.03"/></pattern>
  </defs>
  <rect width="1600" height="620" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="620" rx="26" fill="url(#grid)"/>
  <text x="70" y="70" font-family="JetBrains Mono,monospace" font-size="15" letter-spacing="4" fill="#4ade80">PROJECT ECOSYSTEM / ENGINEERING MAP</text>
  <text x="70" y="105" font-family="JetBrains Mono,monospace" font-size="13" fill="#e4e2df" fill-opacity="0.55">ONE PHONE · SHARED EVIDENCE LOOP · DISTINCT SYSTEM ROLES</text>

  <g fill="none" stroke="url(#line)" stroke-width="2">
    <path d="M800 310 C650 220 500 190 310 180"/>
    <path d="M800 310 C650 310 510 310 310 310"/>
    <path d="M800 310 C650 400 500 440 310 440"/>
    <path d="M800 310 C950 220 1100 190 1290 180"/>
    <path d="M800 310 C950 310 1090 310 1290 310"/>
    <path d="M800 310 C950 400 1100 440 1290 440"/>
  </g>
  <g fill="#22c55e" fill-opacity="0.14" filter="url(#glow)"><circle cx="800" cy="310" r="54"/></g>
  <circle cx="800" cy="310" r="38" fill="#07150d" stroke="#4ade80" stroke-opacity="0.65" stroke-width="2"/>
  <text x="800" y="304" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" font-weight="700" fill="#e4e2df">PHONE-FIRST</text>
  <text x="800" y="326" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" letter-spacing="2" fill="#4ade80">BUILD + VERIFY</text>

  <g font-family="JetBrains Mono,monospace">
    <g><rect x="110" y="140" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="135" y="172" font-size="17" fill="#4ade80">LAI</text><text x="135" y="198" font-size="11" fill="#e4e2df" fill-opacity="0.62">LOCAL AI · ANDROID AUTOMATION · INFERENCE</text></g>
    <g><rect x="110" y="270" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="135" y="302" font-size="17" fill="#4ade80">GGEN</text><text x="135" y="328" font-size="11" fill="#e4e2df" fill-opacity="0.62">CREATIVE + DOCUMENT STUDIO · DART CORE</text></g>
    <g><rect x="110" y="400" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="135" y="432" font-size="17" fill="#4ade80">SONGJOG</text><text x="135" y="458" font-size="11" fill="#e4e2df" fill-opacity="0.62">BANGLA-FIRST BUSINESS + INSTITUTION OPERATIONS</text></g>
    <g><rect x="1090" y="140" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="1115" y="172" font-size="17" fill="#4ade80">ADT</text><text x="1115" y="198" font-size="11" fill="#e4e2df" fill-opacity="0.62">AOSP NATIVE ARM64 TOOLCHAIN · OFFLINE ARTIFACTS</text></g>
    <g><rect x="1090" y="270" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="1115" y="302" font-size="17" fill="#4ade80">TERNuX</text><text x="1115" y="328" font-size="11" fill="#e4e2df" fill-opacity="0.62">NO-ROOT DEBIAN/XFCE · GPU ROUTES · DOCTOR TOOLS</text></g>
    <g><rect x="1090" y="400" width="400" height="82" rx="14" fill="#060706" stroke="#4ade80" stroke-opacity="0.24"/><text x="1115" y="432" font-size="17" fill="#4ade80">DOCDR</text><text x="1115" y="458" font-size="11" fill="#e4e2df" fill-opacity="0.62">MOBILE-FIRST OFFLINE DOCUMENT WORKSPACE</text></g>
  </g>

  <rect x="70" y="535" width="1460" height="1" fill="url(#line)"/>
  <g font-family="JetBrains Mono,monospace" font-size="11" letter-spacing="2" fill="#e4e2df" fill-opacity="0.45">
    <text x="70" y="570">TERMUX / PROOT</text><text x="340" y="570">GITHUB ACTIONS</text><text x="620" y="570">ADB</text><text x="810" y="570">REAL DEVICE</text><text x="1010" y="570">MEASURE</text><text x="1190" y="570">DOCUMENT</text><text x="1370" y="570">REPEAT</text>
  </g>
  <rect x="1" y="1" width="1598" height="618" rx="26" fill="none" stroke="#e4e2df" stroke-opacity="0.09"/>
