<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Sobuj Miah — Project ecosystem and multi-tool development environment</title>
  <desc id="desc">A glossy emerald cybernetic map. Ternux is the primary Termux and PRoot workspace. The workbench includes ADT and ADB, Git and GitHub CLI, language and build tools, GitHub Actions and AI engineering tools. Work paths connect the workbench to LAI, GGEN and Songjog.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
    .ui{font-family:Inter,Arial,sans-serif}.display{font-family:'Instrument Serif',Georgia,serif}.mono{font-family:'JetBrains Mono',monospace}
    .flow{fill:none;stroke:url(#signal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:6 12;animation:flow 8s linear infinite}
    .f2{animation-duration:10s;animation-direction:reverse}.f3{animation-duration:12s;animation-delay:-3s}.f4{animation-duration:9s;animation-delay:-5s}.f5{animation-duration:14s;animation-direction:reverse}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.8s ease-in-out infinite}.p2{animation-delay:-1.1s}.p3{animation-delay:-2.2s}.p4{animation-delay:-.55s}
    .scan{animation:scan 9s cubic-bezier(.4,0,.25,1) infinite}
    .glint{animation:glint 7s ease-in-out infinite}
    .orbit{transform-origin:800px 292px;animation:orbit 26s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-216}}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(.78)}45%,60%{opacity:1;transform:scale(1.2)}}
    @keyframes scan{0%,10%{transform:translateY(-90px);opacity:0}22%{opacity:.55}55%{opacity:.15}82%,100%{transform:translateY(950px);opacity:0}}
    @keyframes glint{0%,20%{transform:translateX(-1100px);opacity:0}38%{opacity:.4}65%,100%{transform:translateX(1700px);opacity:0}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan,.glint,.orbit{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050507"/><stop offset=".4" stop-color="#07150D"/><stop offset=".72" stop-color="#06110B"/><stop offset="1" stop-color="#050507"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12341f" stop-opacity=".78"/><stop offset=".42" stop-color="#07150D" stop-opacity=".94"/><stop offset="1" stop-color="#050507" stop-opacity=".98"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ade80" stop-opacity=".82"/><stop offset=".52" stop-color="#22c55e" stop-opacity=".15"/><stop offset="1" stop-color="#e4e2df" stop-opacity=".2"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981" stop-opacity=".12"/><stop offset=".5" stop-color="#4ade80"/><stop offset="1" stop-color="#22c55e" stop-opacity=".12"/></linearGradient>
    <linearGradient id="glint-fill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#b7ffd2" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22c55e" stop-opacity=".2"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e4e2df" stroke-opacity=".04"/></pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".7" fill="#4ade80" fill-opacity=".24"/></pattern>
    <clipPath id="clip"><rect width="1600" height="930" rx="26"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4ade80"/></marker>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="930" fill="url(#bg)"/><rect width="1600" height="930" fill="url(#grid)"/><ellipse cx="800" cy="360" rx="720" ry="430" fill="url(#halo)"/>
    <text x="64" y="54" class="mono" font-size="11" font-weight="600" letter-spacing="2.8" fill="#4ade80">PROJECT ECOSYSTEM / DEVELOPMENT ENVIRONMENT</text>
    <text x="64" y="94" class="display" font-size="35" fill="#e4e2df">One workspace. A versatile engineering workbench.</text>
    <text x="64" y="120" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".58">Shared tools support distinct projects across build, test, research and delivery.</text>
    <g>
      <rect x="64" y="150" width="1472" height="122" rx="16" fill="url(#glass)" stroke="url(#edge)"/>
      <rect x="64" y="150" width="1472" height="122" rx="16" fill="url(#dots)" opacity=".22"/>
      <path d="M80 151H520" stroke="#b7ffd2" stroke-opacity=".4"/>
      <text x="96" y="181" class="mono" font-size="10" font-weight="600" letter-spacing="2" fill="#4ade80">01 / PRIMARY WORKSPACE</text>
      <text x="96" y="220" class="ui" font-size="25" font-weight="600" fill="#e4e2df">Ternux</text>
      <text x="96" y="246" class="ui" font-size="12" fill="#e4e2df" fill-opacity=".7">Termux + PRoot Debian · ARM64 Linux environment · primary workbench</text>
      <text x="1498" y="218" text-anchor="end" class="mono" font-size="11" fill="#4ade80">WORKSPACE / HOST</text>
      <g class="orbit"><circle cx="800" cy="150" r="5" fill="#4ade80"/><circle cx="800" cy="150" r="11" fill="none" stroke="#4ade80" stroke-opacity=".5"/></g>
    </g>
    <path class="flow" d="M800 272V312" marker-end="url(#arrow)"/>
    <g class="pulse"><circle cx="800" cy="292" r="4" fill="#4ade80"/></g>
    <text x="822" y="296" class="mono" font-size="9" fill="#4ade80">DEVELOPMENT WORKBENCH</text>

    <rect x="64" y="313" width="1472" height="216" rx="16" fill="#050907" fill-opacity=".68" stroke="url(#edge)"/>
    <path d="M80 314H520" stroke="#b7ffd2" stroke-opacity=".35"/>
    <text x="96" y="345" class="mono" font-size="10" font-weight="600" letter-spacing="2" fill="#4ade80">02 / MULTI-TOOL WORKBENCH</text>
    <g class="ui">
      <g><rect x="96" y="366" width="320" height="112" rx="11" fill="url(#glass)" stroke="#4ade80" stroke-opacity=".35"/><text x="116" y="394" font-size="16" font-weight="600" fill="#e4e2df">ADT + ADB</text><text x="116" y="419" font-size="11" fill="#e4e2df" fill-opacity=".68">Android build · install · debug</text><path d="M116 444H380" stroke="#4ade80" stroke-opacity=".22"/><text x="116" y="462" class="mono" font-size="9" fill="#4ade80">ANDROID TOOLING</text></g>
      <g><rect x="438" y="366" width="320" height="112" rx="11" fill="url(#glass)" stroke="#4ade80" stroke-opacity=".28"/><text x="458" y="394" font-size="16" font-weight="600" fill="#e4e2df">Git + GitHub CLI</text><text x="458" y="419" font-size="11" fill="#e4e2df" fill-opacity=".68">Source control · PRs · issues · releases</text><path d="M458 444H722" stroke="#4ade80" stroke-opacity=".22"/><text x="458" y="462" class="mono" font-size="9" fill="#4ade80">REPOSITORY WORKFLOWS</text></g>
      <g><rect x="780" y="366" width="320" height="112" rx="11" fill="url(#glass)" stroke="#4ade80" stroke-opacity=".28"/><text x="800" y="394" font-size="16" font-weight="600" fill="#e4e2df">Build + language tools</text><text x="800" y="419" font-size="11" fill="#e4e2df" fill-opacity=".68">Clang · CMake · Ninja · Flutter / Dart</text><path d="M800 444H1064" stroke="#4ade80" stroke-opacity=".22"/><text x="800" y="462" class="mono" font-size="9" fill="#4ade80">PROJECT-SPECIFIC TOOLCHAINS</text></g>
      <g><rect x="1122" y="366" width="386" height="112" rx="11" fill="url(#glass)" stroke="#4ade80" stroke-opacity=".28"/><text x="1142" y="394" font-size="16" font-weight="600" fill="#e4e2df">CI + AI engineering tools</text><text x="1142" y="419" font-size="11" fill="#e4e2df" fill-opacity=".68">GitHub Actions · agents · review / research</text><path d="M1142 444H1472" stroke="#4ade80" stroke-opacity=".22"/><text x="1142" y="462" class="mono" font-size="9" fill="#4ade80">AUTOMATION + ENGINEERING</text></g>
    </g>
    <path class="flow f2" d="M96 500H1504"/>
    <g class="pulse"><circle cx="96" cy="500" r="3" fill="#4ade80"/></g><g class="pulse p2"><circle cx="800" cy="500" r="3" fill="#4ade80"/></g><g class="pulse p3"><circle cx="1504" cy="500" r="3" fill="#4ade80"/></g>

    <path d="M800 529V561H300V598M800 561V598M800 561H1300V598" fill="none" stroke="#4ade80" stroke-opacity=".36" stroke-width="1.8"/>
    <path class="flow f3" d="M300 561V598" marker-end="url(#arrow)"/><path class="flow f4" d="M800 561V598" marker-end="url(#arrow)"/><path class="flow f5" d="M1300 561V598" marker-end="url(#arrow)"/>
    <g class="pulse"><circle cx="300" cy="561" r="4" fill="#4ade80"/></g><g class="pulse p2"><circle cx="800" cy="561" r="4" fill="#4ade80"/></g><g class="pulse p3"><circle cx="1300" cy="561" r="4" fill="#4ade80"/></g>

    <g class="ui">
      <g><rect x="64" y="599" width="472" height="148" rx="15" fill="url(#glass)" stroke="url(#edge)"/><path d="M80 600H300" stroke="#b7ffd2" stroke-opacity=".38"/><text x="92" y="635" font-size="22" font-weight="600" fill="#4ade80">LAI</text><text x="92" y="661" font-size="12" fill="#e4e2df" fill-opacity=".78">Local AI runtime · Android automation</text><text x="92" y="687" font-size="11" fill="#e4e2df" fill-opacity=".55">CPU inference verified; GPU / NPU in qualification</text><a href="https://github.com/soobujmiah/lai"><text x="92" y="722" class="mono" font-size="10" fill="#4ade80">OPEN REPOSITORY ↗</text></a></g>
      <g><rect x="564" y="599" width="472" height="148" rx="15" fill="url(#glass)" stroke="url(#edge)"/><path d="M580 600H800" stroke="#b7ffd2" stroke-opacity=".38"/><text x="592" y="635" font-size="22" font-weight="600" fill="#4ade80">GGEN</text><text x="592" y="661" font-size="12" fill="#e4e2df" fill-opacity=".78">Creative + document studio</text><text x="592" y="687" font-size="11" fill="#e4e2df" fill-opacity=".55">Pure-Dart core · Flutter UI</text><a href="https://github.com/soobujmiah/ggen"><text x="592" y="722" class="mono" font-size="10" fill="#4ade80">OPEN REPOSITORY ↗</text></a></g>
      <g><rect x="1064" y="599" width="472" height="148" rx="15" fill="url(#glass)" stroke="url(#edge)"/><path d="M1080 600H1300" stroke="#b7ffd2" stroke-opacity=".38"/><text x="1092" y="635" font-size="22" font-weight="600" fill="#4ade80">Songjog</text><text x="1092" y="661" font-size="12" fill="#e4e2df" fill-opacity=".78">Bangla-first business + institution operations</text><text x="1092" y="687" font-size="11" fill="#e4e2df" fill-opacity=".55">Local records · auditable corrections · export</text><a href="https://github.com/soobujmiah/songjog"><text x="1092" y="722" class="mono" font-size="10" fill="#4ade80">OPEN REPOSITORY ↗</text></a></g>
    </g>
    <path d="M64 790H1536" stroke="#4ade80" stroke-opacity=".25"/>
    <text x="64" y="824" class="mono" font-size="10" font-weight="600" letter-spacing="2" fill="#4ade80">ENGINEERING CYCLE</text>
    <g class="mono" font-size="10" fill="#e4e2df" fill-opacity=".78"><text x="80" y="856">IMPLEMENT</text><text x="330" y="856">BUILD / CI</text><text x="580" y="856">DEPLOY</text><text x="830" y="856">DEVICE TEST</text><text x="1080" y="856">DEBUG</text><text x="1330" y="856">DOCUMENT</text></g>
    <path class="flow f2" d="M80 872H1504"/>
    <path class="scan" d="M64 0H1536V2H64Z" fill="#b7ffd2" opacity=".55"/>
    <rect class="glint" x="-1100" y="150" width="240" height="650" fill="url(#glint-fill)" opacity=".14"/>
    <rect x="1" y="1" width="1598" height="928" rx="26" fill="none" stroke="#e4e2df" stroke-opacity=".17"/>
  </g>
</svg>